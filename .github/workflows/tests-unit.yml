name: Tests - Unit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-unit-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-22.04
    name: Unit tests (in the HaRP image)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build HaRP image
        run: docker build -t harp-unit-tests .

      # The tests run inside the image, so they use the Python and library versions HaRP ships with.
      # pip is not part of the image, so it is added for this run only.
      - name: Run unit tests
        run: |
          docker run --rm -v "$PWD":/src:ro -w /src --entrypoint sh harp-unit-tests -c \
            "apk add --no-cache --quiet py3-pip && pip install --break-system-packages --root-user-action=ignore --quiet pytest==9.1.1 && python3 -m pytest tests/unit -p no:cacheprovider"
